<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oh! Mikaté — Mes commandes</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#241A12;
  --ink-muted:#7A6A5C;
  --ink-faint:#A9998A;
  --bg:#FBF3E7;
  --surface:#FFFFFF;
  --surface-alt:#F3E7D4;
  --border:#D9C29E;
  --accent:#E8236B;
  --accent-dark:#B81552;
  --accent-soft:#FCE0EA;
  --gold:#F2871F;
  --gold-soft:#FDEBD3;
  --success:#2E9B5C;
  --success-soft:#E1F5E9;
  --error:#B3261E;
  --error-soft:#F8E6E4;
  --blue:#3A6B7D;
  --amber:#F2871F;
  --amber-soft:#FBEEDD;
  --font-display:'Fredoka',sans-serif;
  --font-logo:'Caveat',cursive;
  --font-body:'Work Sans',sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--ink);padding:24px 16px 60px;max-width:600px;margin-left:auto;margin-right:auto;}
h1{font-family:var(--font-display);font-weight:600;font-size:26px;color:var(--accent);text-align:center;margin:0 0 4px;letter-spacing:0.2px;}
.sous-titre{text-align:center;color:var(--ink-muted);font-size:13px;margin-bottom:26px;}
.lookup-box{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px;}
.lookup-box label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;}
.lookup-box input{width:100%;padding:13px;background:var(--surface-alt);border:1.5px solid var(--border);border-radius:10px;color:var(--ink);font-size:16px;font-family:var(--font-body);box-sizing:border-box;text-align:center;letter-spacing:1px;}
.lookup-box input:focus{border-color:var(--accent);outline:none;}
.btn-lookup{width:100%;margin-top:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font-body);}
.btn-lookup:hover{filter:brightness(1.05);}
.btn-lookup:disabled{opacity:0.6;cursor:not-allowed;}
.msg{text-align:center;font-size:13px;color:var(--ink-muted);padding:20px 0;}
.msg.error{color:var(--error);}
#resultats{display:none;}
.commande-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
.commande-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.commande-date{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--ink);}
.commande-statut{font-size:10px;font-weight:600;padding:3px 9px;border-radius:12px;letter-spacing:0.3px;white-space:nowrap;}
.statut-nouvelle{background:var(--accent-soft);color:var(--accent-dark);}
.statut-confirmee{background:var(--success-soft);color:var(--success);}
.statut-prete{background:#E4EEF1;color:var(--blue);}
.statut-annulee{background:#F0EAE2;color:var(--ink-faint);}
.statut-modifiee{background:#EAE0F5;color:#6B3FA0;margin-left:6px;}
.commandes-onglets{display:flex;gap:8px;margin-bottom:14px;}
.onglet-btn{flex:1;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 8px;font-size:13px;font-weight:600;color:var(--ink-muted);cursor:pointer;font-family:var(--font-body);text-align:center;}
.onglet-btn.actif{background:var(--accent);border-color:var(--accent);color:#fff;}
.commande-detail{font-size:13px;color:var(--ink-muted);line-height:1.7;white-space:pre-wrap;background:var(--surface-alt);border-radius:8px;padding:10px;margin-bottom:10px;}
.commande-meta{font-size:12px;color:var(--ink-faint);margin-bottom:12px;}
.commande-actions{display:flex;gap:8px;flex-wrap:wrap;}
.action-btn{flex:1;min-width:100px;background:var(--surface-alt);border:1.5px solid var(--border);color:var(--ink);font-size:12px;font-weight:600;padding:10px 8px;border-radius:20px;cursor:pointer;font-family:var(--font-body);text-align:center;}
.action-btn.annuler{border-color:var(--error);color:var(--error);}
.action-btn.modifier{border-color:var(--amber);color:var(--amber);}
.action-btn.completer{border-color:var(--success);color:var(--success);}
.action-btn:hover{filter:brightness(0.97);}
.retour{display:block;text-align:center;margin-top:24px;color:var(--accent);text-decoration:none;font-size:13px;font-weight:600;}
.demande-card{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.demande-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.demande-type{font-size:13px;font-weight:600;color:var(--ink);}
.demande-statut{font-size:10px;font-weight:600;padding:3px 9px;border-radius:12px;white-space:nowrap;}
.demande-statut.attente{background:var(--amber-soft);color:var(--amber);}
.demande-statut.traitee{background:var(--success-soft);color:var(--success);}
.demande-statut.refusee{background:var(--error-soft);color:var(--error);}
.demande-meta{font-size:11px;color:var(--ink-faint);}
h2.section-titre{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--ink);margin:24px 0 10px;}

.popup{display:none;position:fixed;inset:0;background:rgba(43,27,18,0.5);z-index:999;align-items:center;justify-content:center;padding:20px;}
.popup.show{display:flex;}
.popup-box{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:22px;max-width:360px;width:100%;}
.popup-box h3{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0 0 6px;color:var(--ink);}
.popup-box p{font-size:13px;color:var(--ink-muted);margin:0 0 14px;line-height:1.5;}
.popup-box textarea{width:100%;padding:11px;background:var(--surface-alt);border:1.5px solid var(--border);border-radius:10px;color:var(--ink);font-size:14px;font-family:var(--font-body);box-sizing:border-box;resize:vertical;min-height:70px;margin-bottom:14px;}
.popup-box textarea:focus{border-color:var(--accent);outline:none;}
.popup-btns{display:flex;gap:10px;}
.popup-btns button{flex:1;padding:12px;border-radius:10px;border:none;font-family:var(--font-body);font-weight:600;font-size:14px;cursor:pointer;}
.popup-cancel{background:var(--surface-alt);color:var(--ink-muted);}
.popup-confirm{background:var(--accent);color:#fff;}
</style>
</head>
<body>

<h1>🧇 Mes commandes</h1>
<p class="sous-titre">Retrouve ta commande avec ton numéro de téléphone</p>

<div class="lookup-box">
  <label for="phone-input">Numéro de téléphone utilisé pour commander</label>
  <input type="tel" id="phone-input" placeholder="06 XX XX XX XX" maxlength="14" inputmode="tel">
  <button class="btn-lookup" id="btn-lookup" onclick="chercherCommandes()">🔍 Retrouver ma commande</button>
</div>

<div id="msg-zone"></div>
<div id="resultats"></div>
<div id="mes-demandes"></div>

<a href="/" class="retour">← Retour au site de commande</a>

<!-- Popup annulation -->
<div class="popup" id="popup-annuler">
  <div class="popup-box" id="popup-annuler-box">
    <h3>🗑️ Annuler la commande</h3>
    <p>Cette demande sera transmise à Oh! Mikaté, qui te confirmera l'annulation. Consulte les CGV pour les conditions de remboursement de l'acompte.</p>
    <div class="popup-btns">
      <button class="popup-cancel" onclick="fermerPopups()">Retour</button>
      <button class="popup-confirm" id="popup-annuler-confirm-btn" style="background:var(--error);" onclick="envoyerDemande('annulation')">Confirmer l'annulation</button>
    </div>
  </div>
</div>

<script>
/* ================================================================
   CONTRAT AVEC LE SCRIPT APPS SCRIPT (backend Google Sheets)
   ----------------------------------------------------------------
   Recherche  : GET  APPS_SCRIPT_URL?action=lookup&phone=0612345678
                -> répond avec un JSON:
                   { "ok": true, "commandes": [
                       { "id": "...", "dateRecu": "...", "name": "...",
                         "order": "...", "total": "...", "payment": "...",
                         "dateRetrait": "...", "creneau": "...", "statut": "nouvelle|confirmee|prete|annulee" }
                   ]}
                Le script NE renvoie QUE les commandes dont le numéro
                normalisé correspond à celui demandé — jamais les autres.

   Demande    : POST APPS_SCRIPT_URL  body JSON:
                { action:"demande", type:"annulation|modification|complement",
                  commandeId, phone, name, dateRetrait, creneau, detail }
                -> ajoute une ligne dans l'onglet "Demandes" du Sheet.
   ================================================================ */
const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbzr6gt_suPlAYt54BQuyhSwVYYF5vnLEFWew-AgNsavCbRJyESQtbhuQzBgaUDDTtGrMA/exec";

let commandesTrouvees=[];
let demandeEnCours=null; // {commandeId, type}

function normalizePhone(raw){
  if(!raw)return"";
  let p=String(raw).replace(/[\s\.\-\(\)]+/g,'');
  if(p.startsWith("+33"))p="0"+p.substring(3);
  else if(p.startsWith("0033"))p="0"+p.substring(4);
  if(!p.startsWith("0"))p="0"+p;
  return p;
}

function afficherMsg(texte,erreur=false){
  document.getElementById("msg-zone").innerHTML=`<div class="msg${erreur?' error':''}">${texte}</div>`;
}

async function chercherCommandes(){
  let raw=document.getElementById("phone-input").value.trim();
  let phone=normalizePhone(raw);
  if(!/^\d{10}$/.test(phone)){
    afficherMsg("⚠️ Merci d'entrer un numéro de téléphone valide.",true);
    return;
  }
  let btn=document.getElementById("btn-lookup");
  btn.disabled=true;btn.textContent="⏳ Recherche...";
  document.getElementById("resultats").style.display="none";
  afficherMsg("");

  try{
    let res=await fetch(APPS_SCRIPT_URL+"?action=lookup&phone="+encodeURIComponent(phone));
    let data=await res.json();
    commandesTrouvees=(data&&data.commandes)||[];
    ongletCommandesActif="encours";
    afficherDemandesClient((data&&data.demandes)||[]);
    if(commandesTrouvees.length===0){
      afficherMsg("Aucune commande trouvée pour ce numéro. Vérifie qu'il s'agit bien du numéro utilisé lors de la commande.");
    }else{
      afficherMsg("");
      afficherResultats();
    }
  }catch(e){
    afficherMsg("❌ Impossible de contacter le service pour le moment. Réessaie dans quelques instants.",true);
  }
  btn.disabled=false;btn.textContent="🔍 Retrouver ma commande";
}

function libelleStatutDemande(s){
  if(s==="Traitée")return{cls:"traitee",txt:"✅ Traitée"};
  if(s==="Refusée")return{cls:"refusee",txt:"❌ Refusée"};
  return{cls:"attente",txt:"⏳ En attente"};
}

const ICONES_DEMANDE={"Annulation":"🗑️","Modification":"✏️","Complément":"➕"};

function afficherDemandesClient(demandes){
  let zone=document.getElementById("mes-demandes");
  let enAttente=(demandes||[]).filter(d=>(d.statut||"En attente")==="En attente");
  if(enAttente.length===0){zone.innerHTML="";return;}
  enAttente.sort((a,b)=>(b.horodatage||"").localeCompare(a.horodatage||""));
  let html=`<h2 class="section-titre">📋 Suivi de mes demandes</h2>`;
  html+=enAttente.map(d=>{
    let statut=libelleStatutDemande(d.statut);
    return`<div class="demande-card">
      <div class="demande-top">
        <span class="demande-type">${ICONES_DEMANDE[d.type]||"📌"} ${d.type||"Demande"}</span>
        <span class="demande-statut ${statut.cls}">${statut.txt}</span>
      </div>
      <div class="demande-meta">📅 ${d.dateRetrait||"—"} • ⏰ ${d.creneau||"—"}${d.detail?" • "+d.detail:""}</div>
    </div>`;
  }).join("");
  zone.innerHTML=html;
}

function libelleStatut(s){
  if(s==="annulee")return{cls:"statut-annulee",txt:"🗑️ Annulée"};
  if(s==="prete")return{cls:"statut-prete",txt:"🍳 Prête"};
  if(s==="confirmee")return{cls:"statut-confirmee",txt:"✅ Confirmée"};
  return{cls:"statut-nouvelle",txt:"🆕 En attente de confirmation"};
}

let ongletCommandesActif="encours";

function changerOngletCommandes(onglet){
  ongletCommandesActif=onglet;
  afficherResultats();
}

function afficherResultats(){
  let zone=document.getElementById("resultats");
  let enCours=commandesTrouvees.filter(c=>c.statut!=="annulee"&&c.statut!=="prete");
  let historique=commandesTrouvees.filter(c=>c.statut==="annulee"||c.statut==="prete");

  let html="";
  if(historique.length>0){
    html+=`<div class="commandes-onglets">
      <button class="onglet-btn${ongletCommandesActif==="encours"?" actif":""}" onclick="changerOngletCommandes('encours')">🕓 En cours (${enCours.length})</button>
      <button class="onglet-btn${ongletCommandesActif==="historique"?" actif":""}" onclick="changerOngletCommandes('historique')">📜 Historique (${historique.length})</button>
    </div>`;
  }

  let liste=(historique.length>0&&ongletCommandesActif==="historique")?historique:enCours;
  if(liste.length===0){
    html+=`<div class="msg">${ongletCommandesActif==="historique"?"Aucune commande dans l'historique.":"Aucune commande en cours."}</div>`;
  }else{
    html+=liste.map(c=>{
      let statut=libelleStatut(c.statut);
      let actions=(c.statut==="annulee"||c.statut==="prete")?"":`<div class="commande-actions" id="actions-${c.id}">
          <button class="action-btn annuler" onclick="ouvrirPopup('annuler','${c.id}')">🗑️ Annuler</button>
          <button class="action-btn modifier" onclick="ouvrirEdition('modification','${c.id}')">✏️ Modifier</button>
        </div>`;
      let acompteNum=parseFloat(String(c.acompte).replace(",","."))||0;
      let totalNum=parseFloat(String(c.total).replace(",","."))||0;
      let soldeNum=Math.round((totalNum-acompteNum)*100)/100;
      let estAcompteEspeces=(c.payment||"").toLowerCase().includes("déposer en espèces");
      let ligneSolde;
      if(estAcompteEspeces&&!c.acompteEspecesRecu){
        // L'acompte espèces n'a pas encore été marqué comme récupéré par Oh! Mikaté :
        // on affiche le découpage attendu, sans présumer qu'il a déjà été réglé.
        let acompteAttendu=Math.round(totalNum*0.5*100)/100;
        let soldeFinal=Math.round((totalNum-acompteAttendu)*100)/100;
        ligneSolde=`<div class="commande-meta">💵 Acompte à apporter en espèces : ${acompteAttendu.toFixed(2)} € • Solde au retrait : ${soldeFinal.toFixed(2)} € <span style="opacity:0.75;">(total dû : ${totalNum.toFixed(2)} €)</span></div>`;
      }else if(soldeNum>0.01){
        ligneSolde=`<div class="commande-meta">💳 Réglé : ${acompteNum.toFixed(2)} € • Reste à payer sur place : <strong>${soldeNum.toFixed(2)} €</strong></div>`;
      }else{
        ligneSolde=`<div class="commande-meta">💳 ${c.payment||"—"} — commande réglée intégralement</div>`;
      }
      return`<div class="commande-card">
        <div class="commande-top">
          <div class="commande-date">📅 ${c.dateRetrait||"—"}</div>
          <span class="commande-statut ${statut.cls}">${statut.txt}</span>${c.modifiee?`<span class="commande-statut statut-modifiee">✏️ Modifiée à ta demande</span>`:""}
        </div>
        <div class="commande-meta">⏰ ${c.creneau||"—"} • 💰 Total : ${c.total||"—"} €</div>
        ${ligneSolde}
        <div class="commande-detail">${c.order||""}</div>
        ${actions}
      </div>`;
    }).join("");
  }

  zone.innerHTML=html;
  zone.style.display="block";
}

const POPUP_ANNULER_HTML_INITIAL=`<h3>🗑️ Annuler la commande</h3>
    <p>Cette demande sera transmise à Oh! Mikaté, qui te confirmera l'annulation. Consulte les CGV pour les conditions de remboursement de l'acompte.</p>
    <div class="popup-btns">
      <button class="popup-cancel" onclick="fermerPopups()">Retour</button>
      <button class="popup-confirm" id="popup-annuler-confirm-btn" style="background:var(--error);" onclick="envoyerDemande('annulation')">Confirmer l'annulation</button>
    </div>`;

// Convertit une date au format "dd/MM/yyyy" (tel que renvoyé par le serveur) en objet Date.
function parseDateFR(str){
  if(!str)return null;
  let m=String(str).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m)return null;
  return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));
}

// Vrai si la commande est retirée aujourd'hui ET qu'il est 14h ou plus passé.
function estApres14hLeJourJ(dateRetrait){
  let dJ=parseDateFR(dateRetrait);
  if(!dJ)return false;
  let maintenant=new Date();
  let memeJour=dJ.getFullYear()===maintenant.getFullYear()&&dJ.getMonth()===maintenant.getMonth()&&dJ.getDate()===maintenant.getDate();
  return memeJour&&maintenant.getHours()>=14;
}

function ouvrirPopup(type,commandeId){
  demandeEnCours={commandeId,type};
  if(type==="annuler"){
    let box=document.getElementById("popup-annuler-box");
    if(box){
      let c=commandesTrouvees.find(x=>String(x.id)===String(commandeId));
      let apres14h=c&&estApres14hLeJourJ(c.dateRetrait);
      box.innerHTML=apres14h
        ?`<h3>⚠️ Annuler la commande</h3>
          <p style="background:var(--error-soft);border:1.5px solid var(--error);border-radius:10px;padding:10px 12px;color:var(--error);font-weight:600;">Il est passé 14h le jour du retrait : conformément aux CGV, l'acompte n'est <u>plus remboursable</u> à partir de cette heure. Ta demande sera tout de même transmise à Oh! Mikaté.</p>
          <div class="popup-btns">
            <button class="popup-cancel" onclick="fermerPopups()">Retour</button>
            <button class="popup-confirm" id="popup-annuler-confirm-btn" style="background:var(--error);" onclick="envoyerDemande('annulation')">Confirmer l'annulation</button>
          </div>`
        :POPUP_ANNULER_HTML_INITIAL;
    }
  }
  document.getElementById("popup-"+type).classList.add("show");
}

function ouvrirEdition(mode,commandeId){
  let phone=normalizePhone(document.getElementById("phone-input").value.trim());
  window.location.href=`/?mode=${encodeURIComponent(mode)}&phone=${encodeURIComponent(phone)}&commande=${encodeURIComponent(commandeId)}`;
}

function fermerPopups(){
  document.querySelectorAll(".popup").forEach(p=>p.classList.remove("show"));
  demandeEnCours=null;
}

async function envoyerDemande(typeDemande){
  if(!demandeEnCours) return;
  let c = commandesTrouvees.find(x => String(x.id) === String(demandeEnCours.commandeId));
  if(!c){
    afficherMsg("❌ Une erreur est survenue (commande introuvable). Merci de rafraîchir la page et réessayer.",true);
    return;
  }

  // Empêche les envois multiples : on désactive le bouton dès le premier clic.
  let btnConfirm=document.getElementById("popup-annuler-confirm-btn");
  let boxPopup=document.getElementById("popup-annuler-box");
  if(btnConfirm){
    if(btnConfirm.disabled)return; // déjà en cours d'envoi, on ignore les clics suivants
    btnConfirm.disabled=true;
    btnConfirm.textContent="⏳ Envoi en cours...";
  }

  let phone = normalizePhone(document.getElementById("phone-input").value.trim());
  let apres14hAnnulation=typeDemande==="annulation"&&estApres14hLeJourJ(c.dateRetrait);
  let payload = {
    action: "demande",
    type: typeDemande,
    commandeId: c.id,
    phone: phone,
    name: c.name || "",
    dateRetrait: c.dateRetrait || "",
    creneau: c.creneau || "",
    detail: apres14hAnnulation ? "⚠️ Annulation après 14h le jour J — acompte normalement non remboursable" : ""
  };

  try {
    let res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    let texte = await res.text();
    if(!res.ok || texte.trim() !== "OK"){
      console.error("Réponse inattendue du serveur:", res.status, texte);
      throw new Error("Réponse serveur invalide");
    }

    // Confirmation affichée directement dans le popup, là où le client regarde déjà,
    // avant de le fermer automatiquement quelques instants après.
    if(boxPopup){
      boxPopup.innerHTML=`<h3>✅ Demande envoyée</h3><p>Ta demande d'annulation a bien été transmise à Oh! Mikaté. Tu recevras une confirmation de sa part.</p>`;
    }
    // Empêche de rouvrir le popup et de renvoyer une demande pour cette commande
    // pendant que la liste n'a pas encore été rafraîchie.
    let actionsEl=document.getElementById("actions-"+c.id);
    if(actionsEl)actionsEl.style.display="none";

    afficherMsg("✅ Ta demande a bien été transmise à Oh! Mikaté !");
    setTimeout(function(){
      fermerPopups();
      chercherCommandes();
    },1800);

  } catch(e) {
    console.error("Erreur lors de l'envoi:", e);
    afficherMsg("❌ Une erreur s'est produite lors de l'envoi. Réessaie, ou contacte Oh! Mikaté directement si le problème persiste.",true);
    if(btnConfirm){
      btnConfirm.disabled=false;
      btnConfirm.textContent="Confirmer l'annulation";
    }
  }
}

</script>
</body>
</html>
